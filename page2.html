<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Eco Blog Page</title>
    <style>
        body {
            font-family: 'Georgia', serif;
            margin: 0;
            padding: 40px 20px;
            background-color: #fbfbf8;
            color: #2f3e36;
        }
        header, .button-container {
            text-align: center;
        }
        h1 {
            font-size: 2.4rem;
            color: #2f3e36;
            font-weight: normal;
            margin-bottom: 30px;
        }
        .image-container {
            margin: 0 auto 25px auto;
            width: 100%;
            max-width: 600px;
            height: 350px;
            background-color: #e6ece8;
            color: #52796f;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 30px;
        }
        p {
            max-width: 580px;
            margin: 0 auto 40px auto;
            font-size: 1.1rem;
            line-height: 1.7;
            color: #354f52;
            text-align: left; /* Editorial alignment */
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 10px 26px;
            background-color: #52796f;
            color: white;
            border: none;
            border-radius: 50px; /* Fully rounded capsule style */
            font-size: 0.95rem;
            cursor: pointer;
            transition: background-color 0.3s ease;
        }
        button:hover {
            background-color: #354f52;
        }
    </style>
</head>
<body>
    <header>
        <h1>Our Nature Journal</h1>
    </header>
      <section id="banner">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmHTQRSUiAw3QPgENnTbCvSTMiO3DbBT6B0eQZLMnru9ufuV9uTfCT4fUT&s=10" alt="Banner Image">
    </section>
    <p>
        Welcome to the journal section. This design utilizes organic shapes, calm colors, and a elegant serif typeface to create a peaceful reading experience for your audience.
    </p>
    <div class="button-container">
        <button onclick="window.location.href='fsd1.html'">Back Home</button>
     
    </div>
</body>
</html>
