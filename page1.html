<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Portfolio Page</title>
    <style>
        body {
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            background-color: #1a1a24;
            color: #e2e8f0;
        }
        h1 {
            font-size: 2.3rem;
            color: #a855f7;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        .image-container {
            margin: 0 auto 25px auto;
            width: 100%;
            max-width: 600px;
            height: 350px;
            background-color: #2d2d3d;
            color: #a855f7;
            border: 2px dashed #a855f7;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
        }
        p {
            max-width: 580px;
            margin: 0 auto 40px auto;
            font-size: 1rem;
            line-height: 1.8;
            color: #94a3b8;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 15px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 24px;
            background-color: transparent;
            color: #a855f7;
            border: 2px solid #a855f7;
            border-radius: 4px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
        }
        button:hover {
            background-color: #a855f7;
            color: #1a1a24;
            box-shadow: 0 0 15px rgba(168, 85, 247, 0.4);
        }
    </style>
</head>
<body>
    <h1>Project Showcase</h1>
   <section id="banner">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmHTQRSUiAw3QPgENnTbCvSTMiO3DbBT6B0eQZLMnru9ufuV9uTfCT4fUT&s=10" alt="Banner Image">
    </section>
    <p>
        Explore the details of this specific project. This dark-themed layout highlights visual imagery and offers a clean, tech-focused environment for presenting your work.
    </p>
    <div class="button-container">
        <button onclick="window.location.href='fsd1.html'">Home</button>
       
    </div>
</body>
</html>
