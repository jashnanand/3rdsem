<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Modern Creative Page</title>
    <style>
        body {
            font-family: 'Trebuchet MS', sans-serif;
            text-align: center;
            margin: 0;
            padding: 40px 20px;
            background-color: #fffaf5;
            color: #4a4a4a;
        }
        .content-card {
            background: white;
            max-width: 650px;
            margin: 0 auto;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(249, 115, 22, 0.1);
        }
        h1 {
            font-size: 2.2rem;
            color: #ea580c;
            margin-top: 0;
        }
        .image-container {
            margin: 20px auto;
            width: 100%;
            height: 320px;
            background-color: #ffedd5;
            color: #ea580c;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
        }
        p {
            font-size: 1.05rem;
            line-height: 1.6;
            color: #666;
            margin-bottom: 30px;
        }
        .button-container {
            display: flex;
            justify-content: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        button {
            padding: 12px 20px;
            background-color: #ff7a59;
            color: white;
            border: none;
            border-radius: 8px;
            font-size: 0.95rem;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 4px 0 #d95336; /* 3D bottom border look */
            transition: transform 0.1s, box-shadow 0.1s;
        }
        button:hover {
            background-color: #ff6540;
        }
        button:active {
            transform: translateY(4px);
            box-shadow: none; /* Presses down when clicked */
        }
    </style>
</head>
<body>

    <!-- Container card to separate content from background -->
    <div class="content-card">
        <h1>Creative Corner</h1>
        
         <section id="banner">
        <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSmHTQRSUiAw3QPgENnTbCvSTMiO3DbBT6B0eQZLMnru9ufuV9uTfCT4fUT&s=10" alt="Banner Image">
    </section>
        <p>
            This layout wraps your content inside a modern card component. It uses playful warm tones, tactile 3D buttons, and clear typography perfect for a creative agency or startup landing page.
        </p>
        
        <div class="button-container">
            <button onclick="window.location.href='fsd1.html'">Main Page</button>
            
        </div>
    </div>

</body>
</html>
